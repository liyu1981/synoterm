# DSM nginx snippet, mounted as https://<nas>:5001/synoterm/ by the
# "web-config" section of conf/resource.
#
# Everything synoterm needs to be reachable from the DSM desktop origin goes
# through here: same-origin, TLS terminated by DSM, no extra firewall port.

location ^~ /synoterm/ {
    # Terminal traffic must never end up in the access log.
    access_log off;

    proxy_pass http://127.0.0.1:7381;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # WebSocket upgrade
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Keep idle but open terminals alive for an hour of user inactivity.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Terminal output must be forwarded without waiting for a full buffer.
    proxy_buffering off;
    proxy_request_buffering off;
}
